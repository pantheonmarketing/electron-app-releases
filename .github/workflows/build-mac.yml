name: Build Mac

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach builds to (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download ffmpeg for macOS
        run: |
          mkdir -p bin/mac
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip ffmpeg.zip -d bin/mac/
          chmod +x bin/mac/ffmpeg

      - name: Build Mac (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate latest-mac.yml (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -1)
          ZIP_NAME=$(basename "$ZIP_FILE")
          VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          ZIP_SIZE=$(stat -f%z "$ZIP_FILE")
          ZIP_SHA=$(shasum -a 512 "$ZIP_FILE" | awk '{print $1}' | xxd -r -p | base64)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          cat > dist/latest-mac.yml << EOF
          version: ${VERSION}
          files:
            - url: ${ZIP_NAME}
              sha512: ${ZIP_SHA}
              size: ${ZIP_SIZE}
          path: ${ZIP_NAME}
          sha512: ${ZIP_SHA}
          releaseDate: '${DATE}'
          EOF

          sed -i '' 's/^          //' dist/latest-mac.yml
          echo "Generated latest-mac.yml:"
          cat dist/latest-mac.yml

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_FILE=$(ls dist/*.dmg | head -1)
          ZIP_FILE=$(ls dist/*.zip | head -1)
          echo "Uploading $DMG_FILE"
          gh release upload "${{ steps.tag.outputs.tag }}" "$DMG_FILE" --clobber
          echo "Uploading $ZIP_FILE"
          gh release upload "${{ steps.tag.outputs.tag }}" "$ZIP_FILE" --clobber
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "Uploading latest-mac.yml"
            gh release upload "${{ steps.tag.outputs.tag }}" "dist/latest-mac.yml" --clobber
          fi
