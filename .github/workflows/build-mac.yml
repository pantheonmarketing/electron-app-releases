name: Build Mac DMG

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach DMG to (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download ffmpeg for macOS
        run: |
          mkdir -p bin/mac
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip ffmpeg.zip -d bin/mac/
          chmod +x bin/mac/ffmpeg

      - name: Build Mac DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish never

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate latest-mac.yml
        run: |
          DMG_FILE=$(ls dist/*.dmg | head -1)
          DMG_NAME=$(basename "$DMG_FILE")
          VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
          SIZE=$(stat -f%z "$DMG_FILE")
          SHA=$(shasum -a 512 "$DMG_FILE" | awk '{print $1}' | xxd -r -p | base64)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)

          cat > dist/latest-mac.yml << EOF
          version: ${VERSION}
          files:
            - url: ${DMG_NAME}
              sha512: ${SHA}
              size: ${SIZE}
          path: ${DMG_NAME}
          sha512: ${SHA}
          releaseDate: '${DATE}'
          EOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' dist/latest-mac.yml
          echo "Generated latest-mac.yml:"
          cat dist/latest-mac.yml

      - name: Upload DMG and latest-mac.yml to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_FILE=$(ls dist/*.dmg | head -1)
          echo "Uploading $DMG_FILE to release ${{ steps.tag.outputs.tag }}"
          gh release upload "${{ steps.tag.outputs.tag }}" "$DMG_FILE" --clobber
          echo "Uploading latest-mac.yml"
          gh release upload "${{ steps.tag.outputs.tag }}" "dist/latest-mac.yml" --clobber
